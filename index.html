<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f1e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japan">
<title>Japan Thanksgiving</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<script>
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div>
      <div class="eyebrow">Gajwani family · Nov 20–29</div>
      <h1 class="brand">Japan Thanksgiving</h1>
    </div>
    <button class="icon-btn" id="theme" aria-label="Switch light or dark mode">◐</button>
  </div>
  <div class="clock" id="clock" aria-live="off"></div>
</header>
<nav class="days" id="days" aria-label="Days"></nav>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Sections">
  <a href="#today" data-tab="day"><span class="ti">◉</span>Today</a>
  <a href="#bookings" data-tab="bookings"><span class="ti">✓</span>Bookings</a>
  <a href="#map" data-tab="map"><span class="ti">⌖</span>Map</a>
  <a href="#phrases" data-tab="phrases"><span class="ti">あ</span>Phrases</a>
  <a href="#food" data-tab="food"><span class="ti">◍</span>Backups</a>
</nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <button class="sheet-close" id="sheet-close" aria-label="Close">×</button>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="unlock.js"></script>
<script src="app.js"></script>
</body>
</html>
